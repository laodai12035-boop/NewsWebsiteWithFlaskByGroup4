services:
  - type: web
    name: news-website
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "newsapp:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
