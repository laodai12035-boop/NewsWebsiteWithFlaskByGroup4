{% extends "base.html" %}

{% block title %}Quên mật khẩu - VÃI CHƯỞNG.SITE !!!{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-container">
        <div class="auth-card">
            <h2>Quên mật khẩu</h2>
            <p style="margin-bottom: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
                Nhập địa chỉ email của bạn và chúng tôi sẽ gửi cho bạn liên kết để đặt lại mật khẩu.
            </p>
            <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="auth-form">
                <div class="form-group">
                    <label for="email">Địa chỉ Email</label>
                    <input type="email" id="email" name="email" required placeholder="Nhập email của bạn...">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Gửi yêu cầu</button>
            </form>
            <div class="auth-links">
                <p>Nhớ mật khẩu? <a href="{{ url_for('auth.login') }}">Đăng nhập</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
